# Configuration for the DESI alert augmentation pipeline.
#
#   desi-aap run --config config.toml
#

[run]
# Root directory for the output of each stage.
output_dir = "output"

# Global Dask cluster settings. Anything dask.distributed.Client
# accepts can go here. A stage can override any of it
# with its own [<stage>.dask] table below.
[dask]
n_workers = 4
threads_per_worker = 1
memory_limit = "2GB"

# ===========================================================================
# Stage: query -- ask BOOM for the alerts in a time window.
# ===========================================================================

[query.boom]
survey = "LSST"

[query.window]
# Width of the trailing query window, ending now.
# Durations are strings: "30m", "2h", "7d", "1d12h".
lookback = "1h"
# Can also specify a start and end time instead of a lookback:
# start = 2026-06-01T00:00:00Z
# end = 2026-06-02T00:00:00Z

# ===========================================================================
# Stage: crossmatch -- match the alerts against each catalog below.
# Each crossmatch creates a new nested column with the results of the match.
# ===========================================================================

[crossmatch.catalogs.desi_dr1]
catalog = "/ocean/projects/phy250012p/shared/3DTS/DESI/dr1/desi_dr1_zcat"
radius_arcsec = 5.0
n_neighbors = 1

[crossmatch.catalogs.desi_dr2]
catalog = "/ocean/projects/phy250012p/shared/3DTS/DESI/dr2/desi_dr2_zcat"
radius_arcsec = 5.0
n_neighbors = 1

# ===========================================================================
# Stage: distance -- put each matched alert at a distance, using the nearest
# DESI host the crossmatch attached to it. Every filter below is a cut on that
# distance in some form, so it is chosen once, here, before any of them run.
# An alert with no usable host has no distance and leaves the run at this point.
# ===========================================================================

[distance]
# Smallest host redshift treated as a real measurement. Below this there is no
# usable luminosity distance: a z of 0 puts the alert at the origin, and a
# small negative one makes the coordinate conversion raise.
min_redshift = 0.0002

# ===========================================================================
# Filters. Each reads the placed alerts above and keeps the ones interesting
# for one reason; each has its own Slack message. They are siblings, so one
# finding nothing does not stop the others.
#
# Filters come in two kinds. Cut filters are JSON files in the directory below,
# one file per filter -- drop one in and the next run picks it up; see the
# shipped filters/luminous.json and filters/nearby.json, and the grammar in
# desi_aap.stages.cut_filter. Code filters, which measure something (the GW
# localization match below), are Python modules with their own section here.
#
# Which filters a run skips is how one config runs the hourly search and
# another the nightly one -- see "Scheduled runs" in the README. Every filter
# is on unless a config says otherwise.
# ===========================================================================

[filters]
# Where the JSON filter definitions live. Relative, like output_dir, so it
# follows the working directory; the shipped definitions are in the repo.
dir = "filters"
# Filters to skip this run, by name -- a JSON filter's filename without .json,
# or a code filter's stage name. This is the knob the cadence overlays turn,
# since JSON does not ride the --config merge: e.g. an hourly overlay sets
# disabled = ["luminous", "nearby"] and leaves the nightly sweep to run them.
disabled = []

# ---------------------------------------------------------------------------
# Filter: localize -- alerts consistent with a GW event localization. Kept if
# the alert lands inside a superevent's 3D credible volume.
# ---------------------------------------------------------------------------

[localize]
enabled = true
# --- Required: what search this is. No defaults, because these three are what a
# result means, and only credible_level is recorded in the stage's output.

# Source classes an event must be, summed over, to be worth matching against.
# One or more of "BNS", "NSBH", "BBH". BNS and NSBH involve a neutron star, so
# they are the ones expected to produce an optical counterpart.
se_types = ["BNS", "NSBH"]
# Half-width of the temporal window, in days either side of the event's
# gw_time. An alert is considered for an event only if it was detected inside
# it -- including before it, since the window is symmetric.
window_days = 14.0
# Credible level the skymap contours are computed at, and that an alert must
# fall inside to count as a coincidence. Note GW localizations are conventionally
# quoted at the 90% credible region, so this is a much tighter cut.
credible_level = 0.5

# --- Defaulted: gates on detection confidence, and one numerical guard. Any of
# these may be left out; the values below are the ones the code would apply.

# False-alarm-rate cut, in events per Julian year: how often a detector network
# would produce a signal this loud from noise alone.
far_threshold_per_year = 2.0
# Combined p_astro probability across se_types an event must exceed.
min_classification_prob_sum = 0.9
# Whether an alert must also fall inside the 2D (sky-only) credible level. The
# 2D and 3D regions do not contain one another, so requiring both discards real
# 3D coincidences -- an alert whose sky position is unremarkable but whose
# distance lands on a high-density slice of the distance posterior.
require_2d_credible_level = false

# ===========================================================================
# Stage: slack_publish -- post each filter's candidates to a Slack channel,
# one message per filter. Optional: without this section the stage skips
# itself, so a fresh clone runs with no Slack app. A filter that found nothing
# is passed over, and a run where every filter found nothing posts nothing.
# ===========================================================================

# [slack]
# # TOML file holding `bot_token = "xoxb-..."`. Keep it outside the repo;
# # see the README for how to register the app and get a token.
# credentials = "~/.config/desi_aap/slack.toml"
# channel = "#desi-alerts"
# # Candidates listed in the message before it cuts off.
# max_rows = 20

# ===========================================================================
# GraceDB -- superevent metadata and skymap cache.
# Read by desi_aap.gracedb_tools, and so by the localize stage above.
# ===========================================================================

[gracedb]
# Relative, like output_dir above, so a fresh clone works anywhere with no
# setup. It follows the working directory, so a scheduled run must start from
# the same place every time or it will quietly build a second cache -- see the
# crontab example in the README. Give an absolute path in your own overlay
# file if you would rather not rely on that.
cache_dir = "gracedb_cache"
# Superevents whose merger is more recent than this are re-checked on every
# run even when nothing in the GraceDB listing has changed, since a file can
# be uploaded without moving any field the listing reports.
recheck_window = "30d"
