
[project]
name = "desi_aap"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Xander J. Hall", email = "xhall@cmu.edu" }
]
description = "DESI Alert Augmentation Pipeline"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "astropy>=8.0",
    "gcn-kafka>=0.3",  # GCN Kafka client for the live notice listener. It pulls in
                       # confluent-kafka, which is why desi_aap.gcn_listener imports it
                       # lazily: parsing, synthesizing and storing notices all work
                       # without a Kafka client present.
    "healpy>=1.17.1",  # 1.17.1 rather than 1.16: healpy imported scipy.integrate.trapz
                       # until then, and scipy removed it in 1.14. scipy is only a transitive
                       # dependency here, so it resolves to a current release even in the
                       # lowest-versions job, and an older healpy fails on import.
    "ligo-gracedb>=2.10",
    "ligo.skymap>=2.4.0",  # 2.4.0 drops python-ligo-lw/ligo-segments for igwn-segments;
                       # ligo-segments has no macOS arm64 wheel and its C extension
                       # fails to compile on Python 3.12
    "matplotlib>=3.6",
    "nested-pandas>=0.6",  # NestedFrame for list-of-struct alert fields; brings in pyarrow
    "numpy>=1.24",
    "lsdb>=0.10.4", # Crossmatching
    "pyarrow>=16",  # Parquet reading and writing
    "pydantic>=2.0", # Validates the TOML configuration file
    "slack-sdk>=3.27",  # Posts each run's results to Slack; pure Python, no compiled deps
    "typer>=0.16",  # Command-line entry point
    "requests>=2.28",
]

[project.scripts]
desi-aap = "desi_aap.cli:app"

[project.urls]
"Source Code" = "https://github.com/CMU-MMA/desi-alert-augmentation-pipeline"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
dev = [
    "jupyter", # Clears output from Jupyter notebooks
    "pre-commit", # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-cov", # Used to report total code coverage
    "ruff", # Used for static linting of files
]

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
desi_aap = ["*.json"]

[tool.setuptools_scm]
write_to = "src/desi_aap/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
    "docs",
]
addopts = "--doctest-modules --doctest-glob=*.rst"

[tool.ruff]
line-length = 110
[tool.ruff.lint.isort]
# Pin first-party detection so different ruff versions (pinned pre-commit vs
# local) agree on import grouping.
known-first-party = ["desi_aap"]
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
"scripts/*" = ["D101","D102","D103"]
# raster_3d_density_slice names its intermediates after the quantities they hold, so dP_dA
# is the probability density per unit area and dV a volume element. Lowercasing them to
# satisfy pep8-naming would leave dp_da and dv, which no longer read as the maths.
"src/desi_aap/skymap_plots.py" = ["N806"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.run]
omit=["src/desi_aap/_version.py"]
