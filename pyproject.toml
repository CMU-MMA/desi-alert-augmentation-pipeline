
[project]
name = "desi_aap"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Xander J. Hall", email = "xhall@cmu.edu" }
]
description = "DESI Alert Augmentation Pipeline"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.28",
    "astropy>=5.3",
    # 1.17.1 rather than 1.16: healpy imported scipy.integrate.trapz until then, and scipy
    # removed it in 1.14. scipy is only a transitive dependency here, so it resolves to a
    # current release even in the lowest-versions job, and an older healpy fails on import.
    "healpy>=1.17.1",
    "matplotlib>=3.6",
    "ligo-gracedb>=2.10",
    "ligo.skymap>=1.0.7",
    # GCN Kafka client for the live notice listener. It pulls in confluent-kafka, which is
    # why desi_aap.gcn_listener imports it lazily: parsing, synthesizing and storing notices
    # all work without a Kafka client present.
    "gcn-kafka>=0.3",
]

[project.urls]
"Source Code" = "https://github.com/CMU-MMA/desi_aap"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
dev = [
    "jupyter", # Clears output from Jupyter notebooks
    "pre-commit", # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-cov", # Used to report total code coverage
    "ruff", # Used for static linting of files
]

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/desi_aap/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
    "docs",
]
addopts = "--doctest-modules --doctest-glob=*.rst"

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
]

[tool.ruff.lint.per-file-ignores]
# raster_3d_density_slice names its intermediates after the quantities they hold, so dP_dA
# is the probability density per unit area and dV a volume element. Lowercasing them to
# satisfy pep8-naming would leave dp_da and dv, which no longer read as the maths.
"src/desi_aap/skymap_plots.py" = ["N806"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.coverage.run]
omit=["src/desi_aap/_version.py"]
